name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff

      - run: ruff check .

  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff black

      - run: ruff format --check .

      - run: black --check .

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [lint, format]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: pip install -e .

      - name: Run tests without model quality threshold
        run: pytest -v --tb=short

  security:
    name: Security scan with Bandit
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install bandit

      - run: bandit -r src/ backend/ -c .bandit.yaml

  docker-backend:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: [security]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t olist-mlops-backend:ci -f backend/Dockerfile .
